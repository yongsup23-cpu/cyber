<!doctype html>
<html lang="ko">
<head><meta charset="utf-8">
<title>사이버 금호 아카이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
:root{--bg:#111211;--panel:#171815;--line:#34332e;--line2:#45443d;--ink:#eee7db;--ink2:#d9cfbf;--mute:#b6ad9e;--gold:#d3bb8c;--gold2:#bda477;--btn:#20211f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif;overflow:hidden}
button{font:inherit;font-size:13px;min-height:40px;padding:8px 14px;background:var(--btn);border:1px solid var(--line2);color:#e5dece;border-radius:3px;cursor:pointer;transition:background .2s}
button:hover{background:#34332c}
button[aria-pressed=true]{background:var(--gold2);color:#171712;border-color:var(--gold2)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);z-index:3}
.brand{font-size:12px;letter-spacing:3px;color:var(--gold);white-space:nowrap}
.brand small{display:block;letter-spacing:.5px;color:var(--mute);font-size:12px;margin-top:3px}
#hallNav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.viewport{position:relative;flex:1;min-height:0;background:#171815}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.roomname{position:absolute;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 8px #000}
#roomNo{font-size:12px;letter-spacing:2px;color:#d3c3a5}
#roomName{margin:6px 0 0;font-family:"Noto Serif KR",serif;font-size:24px;font-weight:400;letter-spacing:.5px}
#chips{position:absolute;top:18px;right:24px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:min(560px,48%);scrollbar-width:none;mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);padding:0 14px}#chips::-webkit-scrollbar{display:none}#chips button{flex:none}
#chips button{min-height:32px;padding:5px 11px;font-size:12px;background:rgba(23,24,21,.82)}
#chips button[aria-pressed=true]{background:var(--gold2);color:#171712}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.45))}
#card{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:rgba(22,24,22,.94);border:1px solid #4d4638;border-top:1px solid #71634c;padding:16px 20px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#card .txt{min-width:0;max-height:26vh;overflow:auto}
#cYear{font-size:12px;letter-spacing:2px;color:var(--gold)}
#cTitle{margin:4px 0 6px;font-family:"Noto Serif KR",serif;font-weight:400;font-size:21px;line-height:1.35}
#cCap{margin:0 0 6px;font-size:14px;color:var(--ink2);line-height:1.6}
#cDetail{margin:0;font-size:13px;line-height:1.75;color:var(--mute);font-weight:300}
#cSrc{margin:8px 0 0;font-size:11px;color:#8f877a}
.side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
#cCount{font-size:12px;letter-spacing:1px;color:var(--mute);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px}
.btns button{min-width:44px}
#enterBtn2,#zoomBtn{background:var(--gold2);color:#171712;border-color:var(--gold2)}
#enterBtn2:hover,#zoomBtn:hover{background:#cdb688}
.look{position:absolute;right:24px;bottom:22px;display:flex;align-items:center;gap:8px;font-size:12px;color:#d6c9b3;text-shadow:0 1px 5px #000}.look button{min-height:36px;min-width:40px;padding:4px 10px;background:rgba(23,24,21,.85)}#bearing{min-width:60px;text-align:center}
.hint{position:absolute;left:24px;bottom:22px;font-size:12px;color:#a79a82;pointer-events:none;text-shadow:0 1px 5px #000;max-width:180px;line-height:1.6}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .42s}
#fade.on{opacity:1}
#loading{position:absolute;top:0;left:0;right:0;height:2px;background:transparent}
#loadBar{height:100%;width:0;background:var(--gold2);transition:width .25s}

.film{position:relative;flex:none;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;padding:15px 14px;background:#0a0a09;border-top:1px solid var(--line);scrollbar-width:thin;scrollbar-color:#45443d transparent;
 background-image:repeating-linear-gradient(90deg,transparent 0 9px,#2a2823 9px 19px,transparent 19px 24px),repeating-linear-gradient(90deg,transparent 0 9px,#2a2823 9px 19px,transparent 19px 24px);
 background-size:24px 6px,24px 6px;background-repeat:repeat-x;background-position:0 4px,0 calc(100% - 4px);background-attachment:local,local}
.film{cursor:grab;user-select:none;-webkit-user-select:none}.film.dragging{cursor:grabbing}.film.dragging .frame{pointer-events:none}
.film::-webkit-scrollbar{height:6px}.film::-webkit-scrollbar-thumb{background:#45443d;border-radius:3px}
.film button{flex:none;min-height:0;padding:0;border-radius:0;background:#141412;border:0}
.film{--fw:92px;--fh:66px}
.film .frame{position:relative;height:var(--fh);width:var(--fw);overflow:hidden;outline:1px solid #2c2a25;transition:opacity .25s,transform .2s,outline-color .2s}
.film .frame i{position:absolute;inset:0;background-repeat:no-repeat;background-size:calc(var(--fw)*10) calc(var(--fh)*var(--rows));background-position:calc(var(--fw)*var(--c)*-1) calc(var(--fh)*var(--r)*-1);filter:sepia(.15) brightness(.82);transition:filter .2s}
.film .frame span{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 3px;font-size:10px;letter-spacing:.5px;color:#eadfca;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:left;font-variant-numeric:tabular-nums}
.film .frame:hover i{filter:none}
.film .frame:hover{transform:translateY(-2px)}
.film .frame.room{outline:1px solid #71634c}
.film .frame.room i{filter:none}
.film .frame[aria-current=true]{outline:2px solid var(--gold);outline-offset:-2px;transform:translateY(-2px)}
.film .dim{opacity:.38}
.film .dim:hover{opacity:.9}
.film .reel{height:66px;width:112px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:0 12px;margin:0 6px 0 10px;background:#1a1b18;border-left:3px solid var(--gold2);text-align:left;color:var(--ink)}
.film .reel:first-child{margin-left:0}
.film .reel b{font-weight:500;font-size:10px;letter-spacing:2px;color:var(--gold)}
.film .reel span{font-family:"Noto Serif KR",serif;font-size:15px}
.film .reel small{font-size:10px;color:var(--mute)}
#intro{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#intro .in{max-width:560px;text-align:left;border-left:3px solid var(--gold2);padding:8px 0 8px 28px}
#intro .k{font-size:12px;letter-spacing:3px;color:var(--gold)}
#intro h1{font-family:"Noto Serif KR",serif;font-weight:400;font-size:clamp(30px,6vw,46px);margin:14px 0 10px;line-height:1.25}
#intro p{color:var(--ink2);font-size:15px;line-height:1.8;font-weight:300;margin:0 0 8px}
#intro .m{color:var(--mute);font-size:13px;margin-bottom:26px}
#enterBtn{background:var(--gold2);color:#171712;border-color:var(--gold2);padding:12px 26px;font-size:14px;letter-spacing:1px}
#lb{position:fixed;inset:0;z-index:12;background:rgba(10,11,10,.985);display:flex;align-items:center;justify-content:center;padding:28px}
#lb[hidden],[hidden]{display:none!important}
#lb .box{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:center;max-width:1280px;width:100%;max-height:100%}
#lbImg{width:100%;height:calc(100vh - 90px);object-fit:contain;justify-self:center}
#lb .meta{border-left:1px solid #71634c;padding-left:22px;max-height:calc(100vh - 80px);overflow:auto}
#lbYear{font-size:12px;letter-spacing:2px;color:var(--gold)}
#lbTitle{font-family:"Noto Serif KR",serif;font-weight:400;font-size:24px;margin:8px 0 12px;line-height:1.35}
#lbCap{color:var(--ink2);font-size:14px;line-height:1.7;margin:0 0 12px}
#lbDetail{color:var(--mute);font-size:13.5px;line-height:1.85;font-weight:300;margin:0 0 14px}
#lbSrc{color:#8f877a;font-size:12px;margin:0}
#lbClose{position:absolute;top:16px;right:16px}
@media (max-width:700px){
 header{padding:10px 14px;flex-wrap:wrap}
 .brand small{display:none}
 #hallNav button{min-height:36px;padding:6px 10px;font-size:12px}
 .roomname{top:12px;left:14px;max-width:56%}
 #roomNo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #roomName{display:none}
 #chips{top:auto;bottom:calc(100% - 0px);display:none}
 #card{bottom:10px;padding:12px 14px;grid-template-columns:1fr;width:calc(100% - 20px)}
 #card .txt{max-height:30vh}
 #cTitle{font-size:18px}
 .side{flex-direction:row;align-items:center}
 .hint{display:none}
 .look{top:12px;right:12px;bottom:auto}
 .look button{min-height:32px;min-width:34px}
 .film{padding:13px 10px;gap:5px}
 .film{--fw:76px;--fh:54px}
 .film .reel{height:54px;width:96px}
 #lb{padding:14px;align-items:flex-start;overflow:auto}
 #lb .box{grid-template-columns:1fr;gap:16px;padding-top:40px}
 #lbImg{height:auto;max-height:58vh}
 #lb .meta{border-left:0;padding-left:0;border-top:1px solid #71634c;padding-top:14px;max-height:none}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="brand">KUMHO · HERITAGE<small>사이버 금호 아카이브 1946 — 2008</small></div>
  <nav id="hallNav" aria-label="전시관 이동">
   <button type="button" data-k="lobby" aria-pressed="true">로비</button>
   <button type="button" data-k="0" aria-pressed="false">1관 창업기</button>
   <button type="button" data-k="1" aria-pressed="false">2관 성장기</button>
   <button type="button" data-k="2" aria-pressed="false">3관 중흥기</button>
  </nav>
 </header>
 <div class="viewport">
  <canvas id="stage" aria-label="가상 전시관"></canvas>
  <div class="vignette"></div>
  <div class="roomname"><div id="roomNo"></div><h2 id="roomName"></h2></div>
  <div id="chips" hidden></div>
  <div class="look"><button type="button" data-look="45" aria-label="왼쪽으로 둘러보기">⟲</button><span id="bearing">정면 벽</span><button type="button" data-look="-45" aria-label="오른쪽으로 둘러보기">⟳</button></div>
  <div class="hint">빈 곳을 클릭하면 앞으로 걷기 · 끌어서 둘러보기 · 사진을 누르면 다가가기</div>
  <section id="card" aria-live="polite">
   <div class="txt">
    <div id="cYear"></div>
    <h3 id="cTitle"></h3>
    <p id="cCap"></p>
    <p id="cDetail"></p>
    <p id="cSrc"></p>
   </div>
   <div class="side">
    <div id="cCount"></div>
    <div class="btns">
     <button type="button" id="prevBtn" aria-label="이전">←</button>
     <button type="button" id="zoomBtn">크게 보기</button>
     <button type="button" id="enterBtn2" hidden>입장하기</button>
     <button type="button" id="nextBtn" aria-label="다음">→</button>
    </div>
   </div>
  </section>
  <div id="loading" hidden><div id="loadBar"></div></div>
  <div id="fade"></div>
 </div>
 <nav id="film" class="film" aria-label="전시 사진 필름 목록"></nav>
</div>
<div id="intro">
 <div class="in">
  <div class="k">KUMHO ARCHIVES · 1946 — 2008</div>
  <h1>사이버 금호 아카이브</h1>
  <p>택시 두 대로 시작한 금호의 역사를 창업기·성장기·중흥기, 세 개의 전시관에 시간 순서대로 걸었습니다. 사진 앞에 서서 그 시절의 이야기를 함께 읽어 보세요.</p>
  <p class="m">빈 곳을 클릭하면 그쪽으로 걸어갑니다 · 화면을 끌면 360° 둘러봅니다 · 사진을 누르면 그 앞으로 다가갑니다</p>
  <button type="button" id="enterBtn">전시 입장</button>
 </div>
</div>
<div id="lb" hidden role="dialog" aria-modal="true" aria-label="작품 크게 보기">
 <button type="button" id="lbClose">닫기 ✕</button>
 <div class="box">
  <img id="lbImg" alt="">
  <div class="meta"><div id="lbYear"></div><h3 id="lbTitle"></h3><p id="lbCap"></p><p id="lbDetail"></p><p id="lbSrc"></p></div>
 </div>
</div>
